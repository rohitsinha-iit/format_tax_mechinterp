eval_dataset: {path: HuggingFaceH4/MATH-500, split: test}

generation:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 3072
  seed: 0
  flush_every: 25

conditions: [FF, JS, JC, 2T]

smoke:
  n_problems: 10
  conditions: [FF, JS, JC]

judge:
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  max_tokens: 2048
  seed: 0
  tail_chars: 800
  tail_chars_fallback: 500       # used per item only if prompt + max_tokens > max_model_len
  calib_frac: 0.10
  calib_seed: 1                   # fresh default_rng(1) per model x condition
  selfcons_n: 100                 # per generator model, stratified across conditions
  selfcons_sample_seed: 2
  selfcons_rerun_seeds: [1, 2]

audit:
  n_flip: 50
  n_not_equiv: 30
  n_calib: 20
  sample_seed: 2
  accept_overall: 0.95
  accept_flip: 0.90

analysis:
  bootstrap_resamples: 10000
  bootstrap_seed: 0
  gate_tax_pp: 3.0
  gate_alpha: 0.05
  truncation_flag: 0.05
