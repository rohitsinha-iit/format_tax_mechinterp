# Generator / judge checkpoints (hybrid-thinking Qwen3, NOT the 2507 variants).
models:
  qwen3-4b:
    hf_id: Qwen/Qwen3-4B
    tag: qwen3-4b-nf4
    max_num_seqs: 8
  qwen3-8b:
    hf_id: Qwen/Qwen3-8B
    tag: qwen3-8b-nf4
    max_num_seqs: 4

judge_model: qwen3-8b

# vLLM engine starting point (handoff §2). On OOM tune ONLY, in order:
#   max_num_seqs -> gpu_memory_utilization 0.80 -> max_model_len 3584.
engine:
  max_model_len: 4096
  gpu_memory_utilization: 0.88
  enforce_eager: true
  seed: 0
  dtype: bfloat16

# HF activation extraction (handoff §2).
hf:
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16
  attn_implementation: sdpa

global_seed: 0
